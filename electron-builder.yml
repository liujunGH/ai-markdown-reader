appId: com.markdownreader.app
productName: Markdown Reader
copyright: Copyright © 2026 liujun
# Icon: place a 1024x1024 PNG at build/icon.png (or .icns for mac, .ico for win)
# electron-builder will auto-detect platform-specific formats from build/icon.*
# If no icon is provided, the default Electron icon is used.

asar:
  # 原生模块由下方 asarUnpack 精确控制，避免 smartUnpack 把整个依赖
  # （包括其他平台的预编译二进制）复制到 app.asar.unpacked。
  smartUnpack: false

# better-sqlite3 的运行时原生模块（.node）无法从 asar 内 dlopen，
# 只解包实际运行需要的模块。不要解包整个依赖目录，否则 node-gyp 的
# 编译期工具（例如包含 x86_64 切片的 python3）也会被装进 macOS App。
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*.node"

directories:
  output: release
  buildResources: build

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# better-sqlite3 是运行时依赖（主进程 import），必须随 node_modules 打包。
# 其余 dependencies 同理由 electron-builder 默认收集（生产依赖）。
files:
  - dist/**/*
  - dist-electron/**/*.js
  - package.json
  - node_modules/better-sqlite3/**/*
  # node-gyp 编译期产物不属于运行时，macOS 会把其中的 x86_64 切片识别为
  # Intel 组件并显示兼容性警告。
  - "!node_modules/better-sqlite3/build/node_gyp_bins{,/**/*}"
  - "!node_modules/better-sqlite3/build/Release/test_extension.node"

extraResources:
  - from: dist-electron/electron/preload.js
    to: electron/preload.js

extraMetadata:
  main: dist-electron/electron/main.js

# Ad-hoc signing when no real Apple Developer ID certificate is available.
# This allows the app to run on macOS with right-click > Open.
# To enable proper code signing, add CSC_LINK / CSC_KEY_PASSWORD secrets to GitHub.
afterPack: build/afterPack.js
afterSign: build/afterSign.js

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Markdown-Reader-${version}.${ext}
  compression: maximum

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # electron-updater 在 macOS 通过 ZIP + latest-mac.yml 完成差分/替换安装。
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Markdown-Reader-${version}-${arch}.${ext}
  category: public.app-category.productivity
  compression: maximum

linux:
  target:
    - AppImage
    - deb
  artifactName: Markdown-Reader-${version}.${ext}
  category: Office
  syncDesktopName: true
  compression: maximum

deb:
  compression: xz

fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown Document
    mimeType: text/markdown
    role: Editor
  - ext: markdown
    name: Markdown Document
    description: Markdown Document
    mimeType: text/markdown
    role: Editor

publish:
  provider: github
  owner: liujunGH
  repo: ai-markdown-reader
